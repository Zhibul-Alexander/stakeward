name: ui-variants

# Design previews (not the product): every push to the design branch builds each UI variant
# (apps/web/variants/<v>, VITE_UI_VARIANT) for devnet and deploys it to <ui1..ui6>.stakeward.com as its own Worker.
# Static files come from the variant build; /api/* goes to stakeward-dev through a service binding. Prod is untouched.
on:
  push:
    branches: [claude/project-thread-oshmst]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-variants
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: skip a variant that does not exist yet
        id: has
        run: |
          if [ -f "apps/web/variants/v${{ matrix.n }}/index.css" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has.outputs.ok == 'true'
        name: build
        working-directory: apps/web
        env:
          VITE_CLUSTER: devnet
          VITE_UI_VARIANT: v${{ matrix.n }}
        run: pnpm exec vite build
      - if: steps.has.outputs.ok == 'true'
        name: deploy
        working-directory: apps/web/variants/preview-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          N: ${{ matrix.n }}
        run: |
          cat > wrangler.json <<JSON
          {
            "name": "stakeward-ui$N",
            "main": "index.ts",
            "compatibility_date": "2026-08-15",
            "preview_urls": false,
            "workers_dev": false,
            "routes": [{ "pattern": "ui$N.stakeward.com", "zone_name": "stakeward.com", "custom_domain": true }],
            "assets": {
              "directory": "../../variants-dist/v$N",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*"]
            },
            "services": [{ "binding": "DEV", "service": "stakeward-dev" }],
            "observability": { "enabled": false }
          }
          JSON
          ../../../worker/node_modules/.bin/wrangler deploy --config wrangler.json
